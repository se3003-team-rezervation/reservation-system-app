name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build, Lint & PostgreSQL Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dormdine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests (PostgreSQL + Fallback)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dormdine_test
          DORMDINE_STORAGE: postgres
        run: npm test

      - name: Build Next.js
        run: npm run build
